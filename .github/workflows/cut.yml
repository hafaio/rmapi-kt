# Cut a release: the sole writer to main -- bump + tag, then dispatch release off the tag.
name: cut
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump type"
        required: true
        type: choice
        options:
          - patch
          - minor
          - major

permissions:
  contents: write # push the bump + tag
  actions: write # dispatch release

jobs:
  gate:
    uses: ./.github/workflows/build.yml

  cut:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main # the branch tip, not the dispatch SHA
          fetch-depth: 0
      - name: Bump, tag, and trigger release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          current=$(grep -oP '^version = "\K[^"]+' build.gradle.kts)
          IFS='.' read -r major minor patch <<< "$current"
          case "${{ inputs.bump }}" in
            major) major=$((major + 1)); minor=0; patch=0 ;;
            minor) minor=$((minor + 1)); patch=0 ;;
            patch) patch=$((patch + 1)) ;;
          esac
          version="${major}.${minor}.${patch}"
          sed -i "s/^version = \".*\"/version = \"${version}\"/" build.gradle.kts
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add build.gradle.kts
          git commit -m "${version}"
          # branch first, tag second (never --follow-tags): a moved main is rejected before the tag exists
          git push origin HEAD:main
          git tag -a "${version}" -m "${version}"
          git push origin "${version}"
          # token-pushed tags don't fire on:push, so dispatch instead
          gh workflow run release.yml --ref main -f tag="${version}"
